name: winche_assets
description: Dart client for Winche Assets — an app's versioned content (translations, pages, media), synced from a channel and kept offline.
version: 0.1.1
homepage: https://github.com/FlameOfUdun/winche-assets-dart-sdk
repository: https://github.com/FlameOfUdun/winche-assets-dart-sdk
issue_tracker: https://github.com/FlameOfUdun/winche-assets-dart-sdk/issues

topics:
  - assets
  - offline
  - translations
  - backend

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.6
  winche_core: ^1.1.1

dev_dependencies:
  http: ^1.2.0
  lints: ^6.0.0
  test: ^1.26.2
